server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Better Auth requires the complete /api/auth/*
    # request path to reach the backend unchanged.
    #
    # No trailing slash on proxy_pass preserves
    # the original request URI.
    location /api/auth/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;

        # Nginx is the trusted client-IP boundary.
        # Client-supplied forwarding headers are
        # overwritten rather than appended.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Preserve the existing Delta API contract:
    # /api/health -> backend /health
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
