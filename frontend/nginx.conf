server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Better Auth requires the complete /api/auth/*
    # request path to reach the backend unchanged.
    #
    # No trailing slash on proxy_pass preserves
    # the original request URI.
    #
    # Email verification links carry a bearer token
    # in the query string. Preserve the complete URI
    # while preventing that credential from entering
    # the proxy access log.
    location = /api/auth/verify-email {
        access_log off;

        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Better Auth accepts the password-reset token
    # on the exact completion endpoint as a query
    # parameter. Keep that credential out of logs.
    location = /api/auth/reset-password {
        access_log off;

        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Password-reset email links carry the reset
    # token in the path. The trailing slash keeps
    # this protection within that route namespace.
    location /api/auth/reset-password/ {
        access_log off;

        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;

        # Nginx is the trusted client-IP boundary.
        # Client-supplied forwarding headers are
        # overwritten rather than appended.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Delta's versioned API is mounted by the backend
    # under the complete /api/v1/* request path.
    location /api/v1/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Preserve the existing Delta API contract:
    # /api/health -> backend /health
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
