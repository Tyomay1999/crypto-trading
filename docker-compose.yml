services:
  postgres:
    image: postgres:18.6-alpine
    container_name: delta-postgres
    environment:
      POSTGRES_DB: delta
      POSTGRES_USER: delta
      POSTGRES_PASSWORD: delta-local-development
    ports:
      - "5432:5432"
    volumes:
      - delta-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U delta -d delta"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: delta-backend
    environment:
      PORT: "3001"
      NODE_ENV: production
      DATABASE_URL: "postgresql://delta:delta-local-development@postgres:5432/delta"
      DATABASE_POOL_MAX: "10"
      DATABASE_CONNECT_TIMEOUT_MS: "3000"
      SHUTDOWN_GRACE_MS: "10000"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: delta-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  delta-postgres-data:
